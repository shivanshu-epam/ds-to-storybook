<style>
  body { font: 12px/1.5 Inter, system-ui, sans-serif; margin: 12px; color: #1e1e1e; }
  textarea { width: 100%; height: 170px; font: 11px ui-monospace, Menlo, monospace; box-sizing: border-box; }
  button { margin: 8px 8px 0 0; padding: 6px 12px; border-radius: 6px; border: 1px solid #c7c7c7; background: #fff; cursor: pointer; }
  button.primary { background: #0d99ff; border-color: #0d99ff; color: #fff; }
  .error { color: #b42318; }
</style>
<p id="status">Reading variables…</p>
<textarea id="out" readonly aria-label="Exported variables JSON"></textarea>
<div>
  <button class="primary" id="download">Download figma-variables.json</button>
  <button id="copy">Copy</button>
  <button id="close">Close</button>
</div>
<script>
  const out = document.getElementById('out');
  const status = document.getElementById('status');
  onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (msg.error) {
      status.textContent = 'Export failed: ' + msg.error;
      status.className = 'error';
      return;
    }
    out.value = msg.json;
    status.textContent = msg.count + ' variables in ' + msg.collections + ' collections' + (msg.skipped ? ' (' + msg.skipped + ' boolean variables skipped)' : '') + '. Save the file next to ds-sync.config.json and set generate.variablesExport.';
  };
  document.getElementById('download').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out.value], { type: 'application/json' }));
    a.download = 'figma-variables.json';
    a.click();
  };
  document.getElementById('copy').onclick = () => {
    out.select();
    document.execCommand('copy');
    status.textContent = 'Copied. Paste it into figma-variables.json.';
  };
  document.getElementById('close').onclick = () => parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
</script>
