# ds-sync: keep the generated Storybook in step with Figma.
# Every weekday it asks Figma for the file's version (one cheap call) and stops if nothing moved. When Figma
# changed, it regenerates, tests the Storybooks, compares them with Figma's renders, and opens a pull request
# whose description lists what changed in Figma, labelled by kind of change, with before/after renders attached.
# Needs a repository secret FIGMA_TOKEN (Figma personal access token, scope file_content:read).
name: ds-sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5' # weekdays 06:00 UTC; runs where Figma did not change stop after one API call

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Until ds-sync is published to npm, build it from its repository.
      - name: Install ds-sync
        id: engine
        run: |
          git clone --filter=blob:none https://github.com/shivanshu-epam/ds-to-storybook.git "$RUNNER_TEMP/ds-sync"
          # The last change to the engine itself (not docs or examples): a new engine may generate different code.
          echo "sha=$(git -C "$RUNNER_TEMP/ds-sync" log -1 --format=%h -- engine)" >> "$GITHUB_OUTPUT"
          cd "$RUNNER_TEMP/ds-sync/engine" && npm ci && npm run build

      - name: Check the FIGMA_TOKEN secret
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          if [ -z "$FIGMA_TOKEN" ]; then
            echo "::error title=ds-sync::The FIGMA_TOKEN repository secret is missing or empty (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Ask Figma who the token belongs to, without printing the token.
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Figma-Token: $FIGMA_TOKEN" https://api.figma.com/v1/me)
          if [ "$status" != "200" ]; then
            echo "::error title=ds-sync::Figma rejected FIGMA_TOKEN (HTTP $status). Create a new personal access token with file_content:read and update the secret."
            exit 1
          fi

      - name: Check Figma for a new version
        id: status
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          node "$RUNNER_TEMP/ds-sync/engine/dist/cli.js" status >> "$GITHUB_OUTPUT"
          if grep -q '^changed=false' "$GITHUB_OUTPUT"; then
            echo "::notice title=ds-sync::Figma has not changed since the last generation."
          fi

      # A Figma version already found to change nothing (with this engine and config) is not regenerated again.
      - name: Was this Figma version already checked?
        id: checked
        if: steps.status.outputs.changed == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .ds-sync/checked
          key: ds-sync-checked-${{ steps.status.outputs.figma_version }}-${{ steps.engine.outputs.sha }}-${{ hashFiles('ds-sync.config.json') }}
          lookup-only: true

      - name: Decide
        id: go
        run: |
          if [ "${{ steps.status.outputs.changed }}" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.checked.outputs.cache-hit }}" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ds-sync::Figma version ${{ steps.status.outputs.figma_version }} was already checked: it changes nothing in the generated code."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Storybook from Figma
        if: steps.go.outputs.run == 'true'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        # Also writes .ds-sync/changes.md (what changed in Figma) and before/after renders in .ds-sync/changes/.
        run: node "$RUNNER_TEMP/ds-sync/engine/dist/cli.js" generate

      - name: Find the output folders
        id: out
        if: steps.go.outputs.run == 'true'
        run: node "$RUNNER_TEMP/ds-sync/engine/dist/cli.js" outputs >> "$GITHUB_OUTPUT"

      - name: Check for design changes
        id: changes
        if: steps.go.outputs.run == 'true'
        run: |
          dirs="${{ steps.out.outputs.dirs }}"
          git add -A -- $dirs
          # Lines that only record the Figma version ("version 123" in reports, "version": "123" in JSON) do not count:
          # a new Figma version with no design change needs no pull request.
          if git diff --cached --quiet -I 'version"?:? "?[0-9]+' -- $dirs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ds-sync::No design changes in Figma since the last generation (only the version number moved), so no pull request."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- $dirs
          fi
          git reset -q

      - name: Test the generated Storybooks
        id: test
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: |
          status=0
          for dir in ${{ steps.out.outputs.dirs }}; do
            echo "::group::$dir"
            (
              cd "$dir"
              # npm ci installs exactly from the lockfile and never rewrites it, so only Figma changes reach the pull request.
              if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
              # The browser that matches this project's Playwright version (not whatever npx would fetch).
              npx playwright install --with-deps chromium
              # A JSON report next to the console output, for the fidelity audit.
              npm run typecheck && npm test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/tests-$(basename "$dir").json"
            ) || status=1
            echo "::endgroup::"
          done
          exit $status

      # Every Figma variant against the built React Storybook, pixel by pixel (report in the run's artifacts).
      - name: Compare with Figma
        id: visual
        if: steps.changes.outputs.changed == 'true' && steps.out.outputs.react_dir != ''
        continue-on-error: true
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          dir="${{ steps.out.outputs.react_dir }}"
          (cd "$dir" && npm run build-storybook -- --quiet)
          python3 -m http.server 6006 --directory "$dir/storybook-static" > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:6006/iframe.html > /dev/null && break; sleep 1; done
          node "$RUNNER_TEMP/ds-sync/engine/dist/cli.js" visual --url http://localhost:6006 --dir "$dir" | tee "$RUNNER_TEMP/visual.txt"
          echo "summary=$(grep '^· Visual:' "$RUNNER_TEMP/visual.txt" | sed 's/^· Visual: //')" >> "$GITHUB_OUTPUT"

      # Scorecards of the React output with the real test and visual results: one status per fidelity measure.
      - name: Fidelity audit
        id: audit
        if: steps.changes.outputs.changed == 'true' && steps.out.outputs.react_dir != ''
        continue-on-error: true
        run: |
          dir="${{ steps.out.outputs.react_dir }}"
          tests="$RUNNER_TEMP/tests-$(basename "$dir").json"
          node "$RUNNER_TEMP/ds-sync/engine/dist/cli.js" audit --dir "$dir" $( [ -f "$tests" ] && echo --tests "$tests" )

      - name: Keep the change images and visual report
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ds-sync-review
          path: |
            .ds-sync/changes/
            .ds-sync/visual/
            .ds-sync/changes.md
            .ds-sync/audit.md
          if-no-files-found: ignore

      - name: Write the pull request description
        if: steps.changes.outputs.changed == 'true'
        run: |
          {
            if [ -n "${{ steps.out.outputs.summary }}" ]; then cat "${{ steps.out.outputs.summary }}"; else echo "Regenerated from Figma by ds-sync."; fi
            echo
            echo "## Checks"
            echo
            echo "- Story tests (every Figma mode): **${{ steps.test.outcome }}**"
            if [ -n "${{ steps.visual.outputs.summary }}" ]; then echo "- Visual check against Figma: ${{ steps.visual.outputs.summary }}"; fi
            if [ -f .ds-sync/audit-summary.md ]; then echo; cat .ds-sync/audit-summary.md; fi
            echo "- Before/after Figma renders of the changed variants and the visual report: the \`ds-sync-review\` artifact of [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open a pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ds-sync/figma-update
          commit-message: 'ds-sync: update Storybook from Figma'
          title: 'ds-sync: update Storybook from Figma'
          body-path: ${{ runner.temp }}/pr-body.md
          labels: ${{ steps.out.outputs.labels }}
          delete-branch: true
          # Only the generated Storybook belongs in this pull request.
          add-paths: ${{ steps.out.outputs.paths }}

      # Remember a version-only Figma update, so the next runs stop after the version check.
      - name: Remember this Figma version
        if: steps.changes.outputs.changed == 'false'
        run: mkdir -p .ds-sync/checked && echo "${{ steps.status.outputs.figma_version }}" > .ds-sync/checked/version

      - name: Save the checked version
        if: steps.changes.outputs.changed == 'false'
        uses: actions/cache/save@v5
        with:
          path: .ds-sync/checked
          key: ds-sync-checked-${{ steps.status.outputs.figma_version }}-${{ steps.engine.outputs.sha }}-${{ hashFiles('ds-sync.config.json') }}
