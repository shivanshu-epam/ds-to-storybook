# Reference spec: Icon. Structure for every design system; values (names, options) come from each system.
id: icon
title: Icon
matches:
  behaviours: []
  names: ["^icons?\\b", "\\bicon\\b"]
primaryAxis: [size, type, variant]
sections:
  - { id: overview, required: true }
  - { id: preview, required: true }
  - { id: variants, required: true }
  - { id: states, required: false }
  - { id: accessibility, required: true }
  - { id: usage, required: true }
  - { id: api, required: true }
  - { id: anatomy, required: false }
  - { id: related, required: false }
  - { id: code, required: true }
stories:
  default: true
  perPrimaryValue: true      # one story per value of the main variant property
  perProperty: true          # one story per other property, all its values side by side
  perOption: true            # one story per optional part (boolean or slot)
  perPropState: true         # disabled, error, warning, read-only, loading, selected
  allVariants: test          # every designed Figma variant, in a test-only story
accessibility:
  pattern: "img or presentation"
  role: "img when meaningful, hidden when decorative"
  name: "aria-label when meaningful."
guidance:  # general guidance for this kind (ds-sync standard); usage drafts may cite it, systems refine it
  whenToUse:
    - "Use an icon to support a label or to show a well-known action in little space."
  whenNotToUse:
    - "Do not use an icon without an accessible name when it is the only content of a control."
