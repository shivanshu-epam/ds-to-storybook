# Reference spec: Radio. Structure for every design system; values (names, options) come from each system.
id: radio
title: Radio
matches:
  behaviours: [radio, radio-single, radio-field, radio-group]
  names: ["radio"]
primaryAxis: [type, variant, style]
sections:
  - { id: overview, required: true }
  - { id: preview, required: true }
  - { id: variants, required: true }
  - { id: states, required: false }
  - { id: accessibility, required: true }
  - { id: usage, required: true }
  - { id: api, required: true }
  - { id: anatomy, required: false }
  - { id: related, required: false }
  - { id: code, required: true }
stories:
  default: true
  perPrimaryValue: true      # one story per value of the main variant property
  perProperty: true          # one story per other property, all its values side by side
  perOption: true            # one story per optional part (boolean or slot)
  perPropState: true         # disabled, error, warning, read-only, loading, selected
  allVariants: test          # every designed Figma variant, in a test-only story
accessibility:
  pattern: "wai-aria/radio"
  role: "radio / radiogroup"
  name: "Group label and option labels."
  keyboard:
    - { key: "Arrow keys", action: "move selection" }
    - { key: "Space", action: "select" }
related: ["radio group"]
