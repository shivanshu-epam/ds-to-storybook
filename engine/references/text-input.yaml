# Reference spec: Text input. Structure for every design system; values (names, options) come from each system.
id: text-input
title: Text input
matches:
  behaviours: [input]
  names: ["input", "text ?field", "text ?area", "search", "password", "number"]
primaryAxis: [type, variant, size, style]
sections:
  - { id: overview, required: true }
  - { id: preview, required: true }
  - { id: variants, required: true }
  - { id: states, required: false }
  - { id: accessibility, required: true }
  - { id: usage, required: true }
  - { id: api, required: true }
  - { id: anatomy, required: false }
  - { id: related, required: false }
  - { id: code, required: true }
stories:
  default: true
  perPrimaryValue: true      # one story per value of the main variant property
  perProperty: true          # one story per other property, all its values side by side
  perOption: true            # one story per optional part (boolean or slot)
  perPropState: true         # disabled, error, warning, read-only, loading, selected
  allVariants: test          # every designed Figma variant, in a test-only story
accessibility:
  pattern: "native input"
  role: "textbox"
  name: "Visible label linked to the field; helper and error text described by."
  keyboard:
    - { key: "Tab", action: "focus" }
related: ["form"]
guidance:  # general guidance for this kind (ds-sync standard); usage drafts may cite it, systems refine it
  whenToUse:
    - "Use a text input for short free-form text such as a name or a search term, with a visible label."
  whenNotToUse:
    - "Do not use a single-line text input for long text: use a text area."
    - "Do not use a text input when the answer is one of a known set of options: use a select or radio buttons."
